[package]
name = "reth-transaction-pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Transaction pool implementation"

[lints]
workspace = true

[dependencies]
# reth
reth-chain-state = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1" }
reth-ethereum-primitives = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false }
reth-chainspec = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false }
reth-eth-wire-types = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1" }
reth-evm = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false }
reth-evm-ethereum = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false }
reth-primitives-traits.workspace = true
reth-execution-types = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false }
reth-fs-util = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1" }
reth-storage-api = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", default-features = false }
reth-tasks = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1" }
revm.workspace = true

# ethereum
alloy-eips = { workspace = true, features = ["kzg"] }
alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-consensus = { workspace = true, features = ["kzg"] }

# async/futures
futures-util.workspace = true
parking_lot.workspace = true
pin-project.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-stream.workspace = true

# metrics
reth-metrics = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1" }
metrics.workspace = true

# misc
aquamarine.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustc-hash.workspace = true
schnellru.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
bitflags.workspace = true
auto_impl.workspace = true
imbl.workspace = true
smallvec.workspace = true

# testing
rand = { workspace = true, optional = true }
paste = { workspace = true, optional = true }
proptest = { workspace = true, optional = true }
proptest-arbitrary-interop = { workspace = true, optional = true }

[dev-dependencies]
reth-provider = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1", features = ["test-utils"] }
reth-tracing = { git = "https://github.com/op-rs/reth", rev = "aef8d3ef92117f91455e16969f0adf5bf7c6e9e1" }
alloy-primitives = { workspace = true, features = ["rand"] }
paste.workspace = true
rand.workspace = true
proptest.workspace = true
proptest-arbitrary-interop.workspace = true
assert_matches.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
futures.workspace = true
criterion.workspace = true
reth-transaction-pool = { workspace = true, features = ["test-utils"] }

[features]
serde = [
    "reth-execution-types/serde",
    "reth-eth-wire-types/serde",
    "alloy-consensus/serde",
    "alloy-eips/serde",
    "alloy-primitives/serde",
    "bitflags/serde",
    "imbl/serde",
    "parking_lot/serde",
    "rand?/serde",
    "smallvec/serde",
    "reth-primitives-traits/serde",
    "reth-ethereum-primitives/serde",
    "reth-chain-state/serde",
    "reth-storage-api/serde",
    "revm/serde",
    "reth-transaction-pool/serde",
]
test-utils = [
    "rand",
    "paste",
    "serde",
    "reth-chain-state/test-utils",
    "reth-chainspec/test-utils",
    "reth-provider/test-utils",
    "reth-primitives-traits/test-utils",
    "reth-ethereum-primitives/test-utils",
    "alloy-primitives/rand",
    "reth-evm/test-utils",
    "reth-evm-ethereum/test-utils",
    "reth-tasks/test-utils",
    "reth-transaction-pool/test-utils",
]
arbitrary = [
    "proptest",
    "proptest-arbitrary-interop",
    "imbl/arbitrary",
    "reth-chainspec/arbitrary",
    "reth-eth-wire-types/arbitrary",
    "alloy-consensus/arbitrary",
    "alloy-eips/arbitrary",
    "alloy-primitives/arbitrary",
    "bitflags/arbitrary",
    "reth-primitives-traits/arbitrary",
    "smallvec/arbitrary",
    "reth-ethereum-primitives/arbitrary",
    "revm/arbitrary",
    "imbl/arbitrary",
    "reth-transaction-pool/arbitrary",
]

[[bench]]
name = "saturated_pool"
harness = false
required-features = ["test-utils"]
